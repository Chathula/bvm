name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-release smoke tests: verify the published archives actually install
  # through the shipped installer scripts on each platform.
  smoke-unix:
    name: Smoke install (unix)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: goreleaser
    steps:
      - name: Install via install.sh
        run: curl -fsSL https://raw.githubusercontent.com/chathula/bvm/${{ github.ref_name }}/install.sh | bash

      - name: Verify bvm runs
        run: |
          # Goreleaser injects the tag WITHOUT its 'v' prefix.
          expected="${GITHUB_REF_NAME#v}"
          "$HOME/.bvm/bin/bvm" --version | grep -q "$expected"

  smoke-windows:
    name: Smoke install (windows)
    runs-on: windows-latest
    needs: goreleaser
    steps:
      - name: Install via install.ps1
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/chathula/bvm/${{ github.ref_name }}/install.ps1" -OutFile install.ps1
          ./install.ps1

      - name: Verify bvm runs
        shell: pwsh
        run: |
          # '&' call operator is required to execute a command built from an
          # expression; goreleaser injects the tag WITHOUT its 'v' prefix.
          $exe = Join-Path $env:USERPROFILE ".bvm\bin\bvm.exe"
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $out = (& $exe --version) | Out-String
          Write-Host $out
          if ($out -notmatch [regex]::Escape($expected)) { exit 1 }
