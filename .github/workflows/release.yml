name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-release smoke tests: verify the published archives actually install
  # through the shipped installer scripts on each platform.
  smoke-unix:
    name: Smoke install (unix)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: goreleaser
    steps:
      - name: Install via install.sh
        run: curl -fsSL https://raw.githubusercontent.com/chathula/bvm/${{ github.ref_name }}/install.sh | bash

      - name: Verify bvm runs
        run: "$HOME/.bvm/bin/bvm --version | grep -q \"${{ github.ref_name }}\""

  smoke-windows:
    name: Smoke install (windows)
    runs-on: windows-latest
    needs: goreleaser
    steps:
      - name: Install via install.ps1
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/chathula/bvm/${{ github.ref_name }}/install.ps1" -OutFile install.ps1
          ./install.ps1

      - name: Verify bvm runs
        shell: pwsh
        run: (Join-Path $env:USERPROFILE ".bvm/bin/bvm.exe") --version | Out-String | ForEach-Object { if ($_ -notmatch [regex]::Escape("${{ github.ref_name }}")) { exit 1 } }
