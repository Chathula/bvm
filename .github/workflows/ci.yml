name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:" && echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      # Enforces a 90% statement-coverage floor; main() is excluded since it
      # only runs inside the built binary.
      - name: Coverage gate
        run: |
          go test ./command/ ./util/ -coverprofile=coverage.out
          go tool cover -func=coverage.out > coverage.txt
          tail -1 coverage.txt
          awk '$3+0 < 90 && $2 != "main" { print "UNDER 90%:", $1, $3; bad = 1 } END { exit bad }' coverage.txt

      # End-to-end: builds bvm and exercises install/use/list/uninstall
      # against the real Bun release infrastructure on every OS.
      - name: E2E tests
        run: go test -tags=e2e ./e2e -v
        env:
          # Lifts the anonymous api.github.com rate limit on shared runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
